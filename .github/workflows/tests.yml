name: Laravel & Flutter Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'mobile/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'mobile/**'

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laundryhub_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, bcmath, ctype, fileinfo, json, mbstring, openssl, tokenizer, xml
          coverage: xdebug

      - name: Install Composer dependencies
        working-directory: ./app
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        working-directory: ./app
        run: |
          cp .env.example .env
          echo "APP_KEY=" >> .env
          php artisan key:generate

      - name: Configure test database
        working-directory: ./app
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laundryhub_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force

      - name: Run Unit Tests
        working-directory: ./app
        run: php artisan test --testsuite=Unit --no-coverage

      - name: Run Feature Tests
        working-directory: ./app
        run: php artisan test --testsuite=Feature --no-coverage

      - name: Run All Tests with Coverage
        working-directory: ./app
        run: php artisan test --coverage --min=50

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./app/coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  flutter-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.7'
          channel: 'stable'

      - name: Get Flutter dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run Flutter Unit Tests
        working-directory: ./mobile
        run: flutter test test/unit_tests/ --coverage

      - name: Run Flutter Widget Tests
        working-directory: ./mobile
        run: flutter test test/widget_tests/ --coverage

      - name: Run All Flutter Tests
        working-directory: ./mobile
        run: flutter test --coverage

      - name: Upload Flutter Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./mobile/coverage/lcov.info
          flags: flutter
          name: flutter-coverage
        continue-on-error: true

